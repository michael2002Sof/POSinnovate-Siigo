name: Deploy Without VPN

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            APP_NAME="pos-siigo"
            BASE_PATH="/home/deploy/github"
            APP_PATH="$BASE_PATH/$APP_NAME"
            REPO_URL="git@github.com:michael2002Sof/POSinnovate-Siigo.git"

            echo "📁 Verificando carpeta del proyecto..."
            if [ ! -d "$APP_PATH" ]; then
              echo "⚠️ No existe → creando carpeta"
              mkdir -p $APP_PATH
            fi

            cd $APP_PATH

            echo "⬇️ Clonando/Actualizando repositorio..."
            if [ ! -d ".git" ]; then
              git clone $REPO_URL $APP_PATH
            else
              git pull origin main
            fi

            echo "📦 Instalando dependencias..."
            npm install

            echo "🔍 Revisando PM2..."
            pm2 describe $APP_NAME > /dev/null 2>&1

            if [ $? -eq 0 ]; then
              echo "♻️ Reiniciando app..."
              pm2 restart $APP_NAME
            else
              echo "🚀 Iniciando app..."
              pm2 start index.js --name $APP_NAME
            fi

            pm2 save
